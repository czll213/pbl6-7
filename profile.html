<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 校园二手交易平台</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="logo">📚 校园二手交易</div>
        <div class="nav-links">
            <a href="index.html">首页</a>
            <a href="products.html">商品列表</a>
            <a href="publish.html">发布商品</a>
            <a href="login.html" id="login-btn">登录</a>
            <a href="register.html" id="register-btn">注册</a>
            <div class="user-menu" id="user-menu" style="display: none;">
                <span id="username"></span>
                <div class="dropdown">
                    <a href="profile.html">个人中心</a>
                    <a href="javascript:void(0)" onclick="logout()">退出登录</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 个人中心 -->
    <section class="profile-container">
        <div class="profile-header">
            <div class="profile-avatar">👤</div>
            <div class="profile-info">
                <h3 id="profile-username">用户名</h3>
                <p id="profile-email">邮箱: user@example.com</p>
                <p>注册时间: 2026-04-16</p>
            </div>
        </div>
        
        <div class="profile-tabs">
            <div class="profile-tab active">我的发布</div>
            <div class="profile-tab">我的收藏</div>
            <div class="profile-tab">个人信息</div>
            <div class="profile-tab">设置</div>
        </div>
        
        <div class="profile-content">
            <h3>我的发布</h3>
            <div class="product-grid">
                <div class="product-card">
                    <div class="product-img">📚</div>
                    <h3>高等数学教材</h3>
                    <p class="price">¥25</p>
                    <p class="location">东区宿舍</p>
                </div>
                <div class="product-card">
                    <div class="product-img">🎧</div>
                    <h3>无线蓝牙耳机</h3>
                    <p class="price">¥80</p>
                    <p class="location">南区食堂</p>
                </div>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2026 校园二手交易平台. 保留所有权利.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
