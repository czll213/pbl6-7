<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布商品 - 校园二手交易平台</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="logo">📚 校园二手交易</div>
        <div class="nav-links">
            <a href="index.html">首页</a>
            <a href="products.html">商品列表</a>
            <a href="publish.html" class="active">发布商品</a>
            <a href="login.html" id="login-btn">登录</a>
            <a href="register.html" id="register-btn">注册</a>
            <div class="user-menu" id="user-menu" style="display: none;">
                <span id="username"></span>
                <div class="dropdown">
                    <a href="profile.html">个人中心</a>
                    <a href="javascript:void(0)" onclick="logout()">退出登录</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 发布商品表单 -->
    <section class="publish-container">
        <h2>发布闲置商品</h2>
        <form id="publish-form" onsubmit="handlePublish(event)" class="publish-form">
            <div class="form-group">
                <label for="product-title">商品标题</label>
                <input type="text" id="product-title" required>
            </div>
            <div class="form-group">
                <label for="product-category">商品分类</label>
                <select id="product-category" required>
                    <option value="">请选择分类</option>
                    <option value="books">图书教材</option>
                    <option value="electronics">电子数码</option>
                    <option value="clothing">服装鞋包</option>
                    <option value="daily">生活用品</option>
                    <option value="sports">运动娱乐</option>
                    <option value="other">其他物品</option>
                </select>
            </div>
            <div class="form-group">
                <label for="product-price">价格 (¥)</label>
                <input type="number" id="product-price" step="0.01" min="0" required>
            </div>
            <div class="form-group">
                <label for="product-description">商品描述</label>
                <textarea id="product-description" required></textarea>
            </div>
            <div class="form-group">
                <label for="product-location">交易地点</label>
                <input type="text" id="product-location" required>
            </div>
            <div class="form-group">
                <label>商品图片</label>
                <input type="file" multiple>
                <p class="hint">支持上传多张图片</p>
            </div>
            <button type="submit" class="btn-primary">发布商品</button>
        </form>
    </section>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2026 校园二手交易平台. 保留所有权利.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
