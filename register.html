<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 校园二手交易平台</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="logo">📚 校园二手交易</div>
        <div class="nav-links">
            <a href="index.html">首页</a>
            <a href="products.html">商品列表</a>
            <a href="publish.html">发布商品</a>
            <a href="login.html" id="login-btn">登录</a>
            <a href="register.html" id="register-btn" class="active">注册</a>
            <div class="user-menu" id="user-menu" style="display: none;">
                <span id="username"></span>
                <div class="dropdown">
                    <a href="profile.html">个人中心</a>
                    <a href="javascript:void(0)" onclick="logout()">退出登录</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 注册表单 -->
    <section class="auth-container">
        <div class="auth-card">
            <h2>用户注册</h2>
            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="register-username">用户名</label>
                    <input type="text" id="register-username" required>
                </div>
                <div class="form-group">
                    <label for="register-email">邮箱</label>
                    <input type="email" id="register-email" required>
                </div>
                <div class="form-group">
                    <label for="register-password">密码</label>
                    <input type="password" id="register-password" required>
                </div>
                <div class="form-group">
                    <label for="register-confirm-password">确认密码</label>
                    <input type="password" id="register-confirm-password" required>
                </div>
                <button type="submit" class="btn-primary">注册</button>
            </form>
            <div class="auth-switch">
                已有账号？ <a href="login.html">立即登录</a>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2026 校园二手交易平台. 保留所有权利.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
